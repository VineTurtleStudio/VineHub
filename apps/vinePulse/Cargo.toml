[package]
name = "vine-pulse"
version = "0.1.0"
edition = "2024"
description = "给文件把脉——检测各类文件是否损坏的桌面端工具"
license = "MIT"

[dependencies]
sha2 = "0.10"
md-5 = "0.10"
crc32fast = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vine-plugin-api = { path = "../../crates/vine-plugin-api" }

# profile 统一走 workspace 根 Cargo.toml
