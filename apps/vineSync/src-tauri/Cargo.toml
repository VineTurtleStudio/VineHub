[package]
name = "vinesync"
version = "0.1.0"
description = "现代化的 Windows 文件夹同步备份工具"
authors = ["VineTurtleStudio"]
edition = "2021"

[lib]
name = "vinesync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
notify = "8"
sha2 = "0.10"
globset = "0.4"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
log = "0.4"
thiserror = "2"
vine-plugin-api = { workspace = true }

# [profile] 只能写在 workspace 根 Cargo.toml（写在此处会被忽略并触发 clippy 警告）。
# 原意图（待 P2.1 迁移时与根 profile 合并定稿，见 VineHub README 横切约定）：
#   codegen-units = 1 / lto = true / opt-level = "s" / strip = true / panic = "abort"
