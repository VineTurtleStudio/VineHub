[workspace]
resolver = "2"
members = [
    "crates/vine-plugin-api",
    "crates/vine-host-core",
    "apps/vine-hub/src-tauri",
    # P2.1 迁入的第一方插件（独立运行能力 100% 保留）
    "apps/vinePulse",
    "apps/vinePress/src-tauri",
    "apps/vineSync/src-tauri",
    "apps/vineCurator/src-tauri",
    "apps/VinePalmaCursor/src-tauri",
    "apps/vineSeal",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = ""

[workspace.dependencies]
vine-plugin-api = { path = "crates/vine-plugin-api" }
vine-host-core = { path = "crates/vine-host-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri = { version = "2" }
tauri-plugin-dialog = "2"
sha2 = "0.10"
md-5 = "0.10"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
crc32fast = "1"
walkdir = "2"
filetime = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }
trash = "5"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
# vinePulse GUI（M3）
eframe = "0.36"
egui = "0.36"
egui_extras = "0.36"
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
