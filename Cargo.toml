[workspace]
resolver = "2"
members = [
    "crates/vine-plugin-api",
    "crates/vine-host-core",
    "apps/vine-hub/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = ""

[workspace.dependencies]
vine-plugin-api = { path = "crates/vine-plugin-api" }
vine-host-core = { path = "crates/vine-host-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri = { version = "2" }
tauri-plugin-dialog = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
strip = true
